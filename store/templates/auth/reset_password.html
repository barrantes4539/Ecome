{% extends 'base.html' %}

{% block content %}
<!-- Header -->
<header class="bg-dark py-5">
    <div class="container px-4 px-lg-5 my-5">
        <div class="text-center text-white">
            <h1 class="display-4 fw-bolder">Restablecer Contraseña</h1>
            <p class="lead fw-normal text-white-50 mb-0">Introduce tu nueva contraseña y confírmala.</p>
        </div>
    </div>
</header>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-8">
            <br/>
            <br/>
            <form id="resetPasswordForm">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ email }}" placeholder="Introduce tu correo electrónico" required readonly>
                </div>
                <div class="mb-3">
                    <label for="new_password1" class="form-label">Nueva Contraseña</label>
                    <input type="password" class="form-control" id="new_password1" name="new_password1" placeholder="Introduce tu nueva contraseña" required>
                </div>
                <div class="mb-3">
                    <label for="new_password2" class="form-label">Confirmar Nueva Contraseña</label>
                    <input type="password" class="form-control" id="new_password2" name="new_password2" placeholder="Confirma tu nueva contraseña" required>
                </div>
                
                <br/>
                <button type="submit" class="btn btn-secondary">Restablecer Contraseña</button>

                <br/>
                <br/>
                <br/>
                <br/>
                <br/>
                <br/>
                <br/>
                <br/>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    $(document).ready(function() {
        $('#resetPasswordForm').on('submit', function(event) {
            event.preventDefault();

            var email = $('#email').val();
            var newPassword1 = $('#new_password1').val();
            var newPassword2 = $('#new_password2').val();

            $.ajax({
                type: 'POST',
                url: '{% url "reset_password" %}', // Asegúrate de que esta URL sea correcta
                data: {
                    email: email,
                    new_password1: newPassword1,
                    new_password2: newPassword2,
                    csrfmiddlewaretoken: '{{ csrf_token }}' // Asegúrate de incluir el token CSRF
                },
                success: function(response) {
                    window.location.href = response.redirect_url;
                },
                error: function(xhr) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: xhr.responseJSON.error,
                    });
                }
            });
        });
    });
</script>

{% endblock %}
